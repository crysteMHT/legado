name: Build Release APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease
      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias legado -storepass 123456 -keypass 123456 -dname "CN=Legado"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-key-alias legado \
            --ks-pass pass:123456 --key-pass pass:123456 --out legado-3d-release.apk aligned.apk
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-3d-release-apk
          path: legado-3d-release.apk
